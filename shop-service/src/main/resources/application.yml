spring:
  application:
    name: shop-service
  datasource:
    # 默认值仅用于本地开发；共享环境必须通过环境变量注入真实连接信息。
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:javafix_shop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:javafix}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  # XML 映射文件统一放在 resources/mapper 下。
  mapper-locations: classpath*:mapper/**/*.xml
